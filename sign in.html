<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In — Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Sign In</h1>
        <div class="card-header">
          <h1 id="signin-title">Sign in</h1>
          <button id="themeToggle" class="theme-toggle" aria-pressed="false" title="Toggle light/dark">🌙</button>
        </div>
      <form id="signin-form" aria-label="Sign in form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required minlength="6" />

        <div class="row">
          <label class="checkbox"><input id="remember" type="checkbox" /> Remember me</label>
        </div>

        <button id="signin-btn" type="submit">Sign In</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <footer class="hint">
        <strong>Demo credentials:</strong> user@example.com / password123
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
